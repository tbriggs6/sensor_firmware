#
# Zephyr configuration for spinet_node (CC13xx, 6LoWPAN border router)
#

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Kernel and logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# Networking baseline
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_IEEE802154=y
CONFIG_NET_L2_IEEE802154_6LOWPAN=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y

# Border router / routing options will be refined later.

